main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - job_id: ${args.jobId}
          - require_approval: ${default(map.get(args, "requireApproval"), true)}
          - max_critic_loops: 2
          - critic_attempt: 0
          - stages_visited: ["queued", "ingesting", "planning"]
    - check_approval_gate:
        switch:
          - condition: ${require_approval == true and default(map.get(args, "approved"), false) == false}
            next: pause_awaiting_approval
        next: stage_scripting
    - pause_awaiting_approval:
        return:
          jobId: ${job_id}
          state: "awaiting_approval"
          stagesVisited: ${stages_visited}
          message: "Paused at human-in-the-loop storyboard approval gate."
    - stage_scripting:
        assign:
          - stages_visited: ${list.concat(stages_visited, ["scripting", "synthesizing_voice", "illustrating", "rendering", "critiquing", "publishing"])}
          - critic_attempt: ${critic_attempt + 1}
    - stage_publishing:
        return:
          jobId: ${job_id}
          state: "done"
          stagesVisited: ${stages_visited}
          criticAttempts: ${critic_attempt}
