steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-render-job'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step5'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-render-job'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step5'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-inside-container'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'bash'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step5'
      - '-c'
      - |
        echo "=== CONTAINER_VERIFY_START ==="
        uv --version; ffmpeg -version | head -1; node --version
        python3 -c "import numpy, playwright; from importlib.metadata import version; print(numpy.__version__, version('playwright'))"
        ls /app/vendor/papermorph/engine/ | head
        ls /app/vendor/papermorph/site/ | head
        echo "=== CONTAINER_VERIFY_END ==="
images:
  - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step5'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
