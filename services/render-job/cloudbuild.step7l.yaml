steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args: ['-c', 'docker pull us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step7k || true']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-render-job'
    args:
      - 'build'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step7k'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step7l'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-no-baked-book'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'bash'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step7l'
      - '-c'
      - |
        echo "=== VERIFY_NO_BAKED_BOOK_START ==="
        if [[ -e /app/vendor/papermorph/books/lion-and-mouse || -e /app/vendor/papermorph/content/lion-and-mouse || -e /app/vendor/papermorph/site/lion-and-mouse ]]; then
          echo "FATAL: lion-and-mouse still exists in container!" >&2
          exit 1
        fi
        echo "NO_LION_AND_MOUSE_IN_CONTAINER=true"
        echo "=== VERIFY_NO_BAKED_BOOK_END ==="
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-render-job'
    args: ['push', 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step7l']
images:
  - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:step7l'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
