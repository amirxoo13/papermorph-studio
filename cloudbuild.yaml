steps:
  - name: 'python:3.12-slim'
    id: 'unit-and-integration-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir pytest pydantic fastapi httpx google-cloud-firestore google-cloud-storage google-cloud-bigquery google-cloud-dlp pillow
        PYTHONPATH=.:services/agents:services/api pytest schemas/test_phase2.py services/api/tests/test_phase7.py web/test_phase9.py

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-image'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/papermorph/pm-api:$COMMIT_SHA', 'services/api']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-mcp-tools-image'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/papermorph/pm-mcp-tools:$COMMIT_SHA', 'services/mcp-tools']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-render-job-image'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/papermorph/pm-render-job:$COMMIT_SHA', 'services/render-job']

options:
  logging: CLOUD_LOGGING_ONLY
