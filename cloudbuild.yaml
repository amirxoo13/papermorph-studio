steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pm-sandbox'
    args: ['build', '-f', 'services/sandbox/Dockerfile', '-t', 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-sandbox:v1.0.0', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pm-mcp-tools'
    args: ['build', '-f', 'services/mcp-tools/Dockerfile', '-t', 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-mcp-tools:v1.0.0', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pm-api'
    args: ['build', '-f', 'services/api/Dockerfile', '-t', 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-api:v1.0.0', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-pm-render-job'
    args: ['build', '-f', 'services/render-job/Dockerfile', '-t', 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:v1.0.0', '.']

images:
  - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-sandbox:v1.0.0'
  - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-mcp-tools:v1.0.0'
  - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-api:v1.0.0'
  - 'us-central1-docker.pkg.dev/gen-lang-client-0484425781/papermorph/pm-render-job:v1.0.0'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
